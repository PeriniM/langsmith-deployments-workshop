[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[project]
name = "workshop-planner-agent"
version = "0.1.0"
description = "LangChain v1 workshop showcasing agent capabilities"
authors = [
    { name = "Marco Perini", email = "" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langgraph>=1.1.0",
    "langgraph-cli[inmem]>=0.4.15",
    "python-dotenv>=1.0.0",
    "deepagents>=0.4.0",
    "deepagents-cli>=0.0.3",
]

